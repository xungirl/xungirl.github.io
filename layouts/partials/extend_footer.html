<div class="site-extra" style="text-align:center;padding:10px 0;">
    <span class="custom-footer" style="display:block" id="site-timer"></span>
    <div id="clstr-globe-box" style="display:flex;justify-content:center;margin:10px auto;width:70px;height:70px;overflow:hidden;"></div>
</div>
<script>
    function updateTimer() {
        const startDate = new Date("2026-02-10");
        const now = new Date();
        const diff = now - startDate;
        const days = Math.floor(diff / (1000 * 60 * 60 * 24));
        const hours = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
        const minutes = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
        const seconds = Math.floor((diff % (1000 * 60)) / 1000);
        document.getElementById("site-timer").innerHTML = 
            "Blog has been running for " + days + " days " + hours + "h " + minutes + "m " + seconds + "s";
    }
    updateTimer();
    setInterval(updateTimer, 1000);

    // ClustrMaps globe: load only after the page is done, so a slow or down clustrmaps.com
    // can't block the timer and the scripts below (it used to be a blocking <script src>).
    window.addEventListener("load", function () {
        var s = document.createElement("script");
        s.id = "clstr_globe"; s.async = true;
        s.src = "//clustrmaps.com/globe.js?d=6Q2_aLfI7DSLKwWEsKB6ymrM8PJQnAH3l9SE3VCgado";
        document.getElementById("clstr-globe-box").appendChild(s);
    });
</script>
<script>
/* Collapsible post cards (glass.css). Opening a card changes the layout under the cursor:
   when the card above collapses, everything below slides up. So:
   - only real pointer movement opens a card (the browser's synthetic mousemove after a
     layout shift has unchanged coordinates and is ignored), so shifts can't cascade;
   - while a card animates, new hovers wait until it finishes;
   - the newly opened card is held in place by scrolling, when there is room to scroll.
     The correction runs in a ResizeObserver (after layout, before paint) so it lands in the
     same frame; doing it in requestAnimationFrame lagged a frame and the card visibly jerked. */
(function () {
  if (!document.body.classList.contains("list") || !matchMedia("(hover: hover)").matches) return;
  if (!document.querySelector(".post-entry")) return;
  document.body.classList.add("fold-js");
  var reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  var ANIM = reduce ? 0 : 560, open = null, lockUntil = 0, lx = -1, ly = -1, timer = 0;
  var pinned = null, pinTop = 0;

  function correct() {
    if (!pinned || performance.now() > lockUntil + 100) { pinned = null; return; }
    var d = pinned.getBoundingClientRect().top - pinTop;
    if (Math.abs(d) > 0.5) window.scrollBy(0, d);
  }
  var ro = new ResizeObserver(correct);
  document.querySelectorAll(".post-entry").forEach(function (c) { ro.observe(c); });

  function setOpen(card) {
    if (card === open) return;
    pinned = (card && !reduce) ? card : null;
    if (pinned) pinTop = card.getBoundingClientRect().top;
    if (open) open.classList.remove("open");
    if (card) card.classList.add("open");
    open = card;
    lockUntil = performance.now() + ANIM;
  }
  function evaluate() {
    var wait = lockUntil - performance.now();
    if (wait > 0) { timer = setTimeout(evaluate, wait); return; }
    var el = lx < 0 ? null : document.elementFromPoint(lx, ly);
    setOpen(el && el.closest(".post-entry"));
  }
  document.addEventListener("mousemove", function (e) {
    if (e.clientX === lx && e.clientY === ly) return;
    lx = e.clientX; ly = e.clientY;
    clearTimeout(timer);
    // short hover-intent delay on a card; longer grace period in the gaps between cards
    timer = setTimeout(evaluate, e.target.closest && e.target.closest(".post-entry") ? 80 : 250);
  });
  document.documentElement.addEventListener("mouseleave", function () {
    lx = ly = -1; clearTimeout(timer); timer = setTimeout(evaluate, 250);
  });
})();
</script>
